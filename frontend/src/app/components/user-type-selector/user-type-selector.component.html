<ion-segment
  class="sa-segment"
  [value]="value()"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  (ionChange)="select($event.detail.value)"
>
  @for (option of options(); track option.value) {
    <ion-segment-button [value]="option.value">
      <ion-label>{{ option.label }}</ion-label>
    </ion-segment-button>
  }
</ion-segment>
