<ion-segment class="sa-segment" [value]="group()" (ionChange)="select($event.detail.value)" aria-label="Reviews by">
  @for (option of options; track option.value) {
    <ion-segment-button [value]="option.value">
      <ion-label>{{ option.label }}</ion-label>
    </ion-segment-button>
  }
</ion-segment>
