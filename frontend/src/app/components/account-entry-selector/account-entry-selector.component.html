<ion-segment [value]="mode()" (ionChange)="select($event.detail.value)" aria-label="Log in or sign up">
  <ion-segment-button value="login">
    <ion-label>Log in</ion-label>
  </ion-segment-button>
  <ion-segment-button value="signup">
    <ion-label>Sign up</ion-label>
  </ion-segment-button>
</ion-segment>
